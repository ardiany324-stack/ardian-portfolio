
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ardian Mahjong</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(ellipse at top, #164e8a, #061326 70%);
}

header {
  padding: 22px;
  text-align: center;
  border-bottom: 1px solid #2563a866;
}

header h1 {
  color: #93c5fd;
  letter-spacing: 3px;
  font-size: 27px;
}

header p {
  color: #9db9d9;
  margin-top: 8px;
  font-size: 13px;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 22px 14px;
}

.info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

.stat {
  background: #10294a;
  border: 1px solid #28558a;
  padding: 12px 18px;
  border-radius: 12px;
  text-align: center;
  flex: 1;
}

.stat small {
  display: block;
  color: #91b9e9;
  margin-bottom: 5px;
}

.stat strong {
  font-size: 22px;
}

.board {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 7px;
  padding: 14px;
  background: #071a31cc;
  border: 1px solid #24538a;
  border-radius: 18px;
  box-shadow: 0 0 35px #0284c733;
}

.tile {
  aspect-ratio: 0.78;
  min-width: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: clamp(20px, 5vw, 37px);
  color: #164e63;
  background: linear-gradient(145deg, #ffffff, #cbdff4);
  border: 2px solid #8db8df;
  border-bottom: 5px solid #789fc7;
  border-radius: 8px;
  cursor: pointer;
  user-select: none;
  transition: 0.15s;
}

.tile:hover {
  transform: translateY(-3px);
  background: #e0f2fe;
}

.tile.selected {
  background: #fde68a;
  border-color: #f59e0b;
  transform: translateY(-5px);
  box-shadow: 0 0 16px #fbbf24aa;
}

.tile.removed {
  visibility: hidden;
  pointer-events: none;
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 22px 0;
}

button {
  padding: 13px 22px;
  border: 1px solid #60a5fa;
  border-radius: 10px;
  background: #123e70;
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

button.primary {
  background: linear-gradient(135deg, #2563eb, #0284c7);
}

button:hover {
  filter: brightness(1.2);
}

#message {
  text-align: center;
  min-height: 24px;
  color: #bfdbfe;
  margin-bottom: 18px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #6685a9;
  font-size: 12px;
}

@media (max-width: 480px) {
  .board {
    gap: 4px;
    padding: 8px;
  }

  .tile {
    border-radius: 5px;
    border-width: 1px;
    border-bottom-width: 3px;
  }

  .stat {
    padding: 10px 5px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🀄 ARDIAN MAHJONG</h1>
  <p>Mahjong Solitaire · Blue Edition</p>
</header>

<main class="container">

  <div class="info">
    <div class="stat">
      <small>SKOR</small>
      <strong id="score">0</strong>
    </div>

    <div class="stat">
      <small>PASANGAN</small>
      <strong id="pairs">0/16</strong>
    </div>

    <div class="stat">
      <small>SISA UBIN</small>
      <strong id="remaining">32</strong>
    </div>
  </div>

  <div id="message">Cocokkan dua ubin dengan gambar yang sama!</div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button class="primary" onclick="startGame()">
      ↻ Game Baru
    </button>
    <button onclick="shuffleGame()">
      🔀 Acak Ubin
    </button>
  </div>

</main>

<footer>
  © 2026 Ardian Yusuf Firdaus · Mahjong Blue
</footer>

<script>
const symbols = [
  "🀇", "🀈", "🀉", "🀊",
  "🀋", "🀌", "🀍", "🀎",
  "🀏", "🀐", "🀑", "🀒",
  "🀙", "🀚", "🀛", "🀜"
];

let tiles = [];
let selected = [];
let score = 0;
let matched = 0;
let locked = false;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function startGame() {
  tiles = shuffle([...symbols, ...symbols].map(
    (symbol, id) => ({ symbol, id, removed: false })
  ));

  selected = [];
  score = 0;
  matched = 0;
  locked = false;

  render();
  updateStats();
  message("Cocokkan dua ubin dengan gambar yang sama!");
}

function render() {
  const board = document.getElementById("board");
  board.innerHTML = "";

  tiles.forEach(tile => {
    const el = document.createElement("button");
    el.className = "tile";
    el.textContent = tile.removed ? "" : tile.symbol;
    el.setAttribute("aria-label", "Ubin Mahjong");

    if (tile.removed) el.classList.add("removed");
    if (selected.includes(tile.id)) {
      el.classList.add("selected");
    }

    el.onclick = () => chooseTile(tile.id);
    board.appendChild(el);
  });
}

function chooseTile(id) {
  if (locked) return;

  const tile = tiles.find(t => t.id === id);
  if (!tile || tile.removed || selected.includes(id)) return;

  selected.push(id);
  render();

  if (selected.length === 2) {
    locked = true;

    const [first, second] = selected.map(
      id => tiles.find(t => t.id === id)
    );

    if (first.symbol === second.symbol) {
      setTimeout(() => {
        first.removed = true;
        second.removed = true;
        matched++;
        score += 100;

        selected = [];
        locked = false;

        updateStats();
        render();

        if (matched === 16) {
          message("🎉 Selamat! Kamu berhasil menyelesaikan Mahjong!");
        } else {
          message("Pasangan cocok! +100 poin");
        }
      }, 350);
    } else {
      score = Math.max(0, score - 10);
      updateStats();
      message("Belum cocok! Coba pasangan lainnya.");

      setTimeout(() => {
        selected = [];
        locked = false;
        render();
      }, 700);
    }
  }
}

function updateStats() {
  document.getElementById("score").textContent = score;
  document.getElementById("pairs").textContent = matched + "/16";
  document.getElementById("remaining").textContent =
    32 - matched * 2;
}

function message(text) {
  document.getElementById("message").textContent = text;
}

function shuffleGame() {
  if (locked) return;

  const remaining = tiles.filter(t => !t.removed);
  const shuffled = shuffle(remaining.map(t => t.symbol));

  remaining.forEach((tile, i) => {
    tile.symbol = shuffled[i];
  });

  selected = [];
  render();
  message("Ubin berhasil diacak!");
}

startGame();
</script>

</body>
</html>
